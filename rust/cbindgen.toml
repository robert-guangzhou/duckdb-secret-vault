language = "C"
include_guard = "SECRET_VAULT_RUST_H"
autogen_warning = "/* Generated by cbindgen via rust/regen-header.sh. DO NOT EDIT. */"
# 容器内 cbindgen 版本不输出 extern "C" 守卫(教训源自 nats_rw 2026-10-26:
# 缺守卫 → C++ 按 mangling 引用符号 → dlopen 解析失败)。开守卫经
# after_includes 注入;闭守卫由 regen-header.sh 后处理插入 include guard
# #endif 之前。
after_includes = """
#ifdef __cplusplus
extern "C" {
#endif
"""
