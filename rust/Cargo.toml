[package]
name = "secret_vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encrypted stored-secrets core for the secret_vault DuckDB extension"

[lib]
crate-type = ["staticlib"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
rand = "0.8"
base64 = "0.22"
keyring = { version = "4", features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
