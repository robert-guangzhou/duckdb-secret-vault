[package]
name = "secret_vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encrypted stored-secrets core for the secret_vault DuckDB extension"

[lib]
# staticlib 供 C++ 链接(corrosion 显式 --crate-type=staticlib);
# rlib 供 rust/tests 集成测试链接(cargo test 需要)
crate-type = ["staticlib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = "0.5"
zeroize = "1"
rand = "0.8"
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"
keyring = { version = "4", features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }

[dev-dependencies]
serde_json = "1"
